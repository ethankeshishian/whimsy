<!-- legacy: Whimsy's default bookmarks for a new profile. engine_overrides.py
     copies this over Firefox's browser/base/content/default-bookmarks.html,
     whose "Mozilla Firefox" folder linked to Mozilla's help and community
     pages. Same structure as Firefox's: one folder in the Bookmarks Menu. -->
<!DOCTYPE NETSCAPE-Bookmark-file-1>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none';">
    <!-- These localization links are not automatically applied to any XHR
         response body and must be applied manually as well.  They are included
         so that viewing the file directly shows the results. -->
    <link rel="localization" href="branding/brand.ftl"/>
    <link rel="localization" href="browser/profile/default-bookmarks.ftl"/>
    <link rel="localization" href="browser/whimsy.ftl"/>
    <title data-l10n-id="default-bookmarks-title">default-bookmarks-title</title>
</head>
