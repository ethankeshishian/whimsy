<!-- home: about:whimsy, Whimsy's homepage (replaces Zen's about:home) with
     a Changelog tab (about:whimsy?tab=changelog). -->
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src chrome:; object-src 'none'" />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="whimsy-home-title"></title>
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" media="all" />
    <link rel="stylesheet" href="chrome://browser/content/whimsy/whimsy-home.css" />
    <link rel="localization" href="browser/whimsy.ftl" />
  </head>
  <body>
    <div class="whimsy-home" id="whimsy-home">
      <header class="whimsy-home-header">
        <h1 id="whimsy-home-heading" data-l10n-id="whimsy-home-brand"></h1>
        <nav class="whimsy-home-tabs" role="tablist" aria-labelledby="whimsy-home-heading">
          <button
            type="button"
            id="whimsy-tab-home"
            aria-controls="whimsy-panel-home"
            class="whimsy-home-tab"
            role="tab"
            data-tab="home"
            data-l10n-id="whimsy-home-tab-home"
            aria-selected="true"
          ></button>
          <button
            type="button"
            id="whimsy-tab-changelog"
            aria-controls="whimsy-panel-changelog"
            tabindex="-1"
            class="whimsy-home-tab"
            role="tab"
            data-tab="changelog"
            data-l10n-id="whimsy-home-tab-changelog"
            aria-selected="false"
          ></button>
        </nav>
      </header>

      <section id="whimsy-panel-home" class="whimsy-home-panel" tabindex="0" role="tabpanel" aria-labelledby="whimsy-tab-home">
        <p class="whimsy-home-blurb" data-l10n-id="whimsy-home-blurb"></p>

        <div class="whimsy-home-links" id="whimsy-home-links">
          <a id="whimsy-home-link-settings" class="whimsy-home-link" href="about:preferences" data-l10n-id="whimsy-home-link-settings"></a>
          <a id="whimsy-home-link-shortcuts" class="whimsy-home-link" href="about:keyboard" data-l10n-id="whimsy-home-link-shortcuts"></a>
          <button
            type="button"
            class="whimsy-home-link whimsy-home-link-button"
            id="whimsy-home-link-import"
            data-l10n-id="whimsy-home-link-import"
          ></button>
          <a
            id="whimsy-home-link-feedback"
            class="whimsy-home-link"
            href="https://github.com/ethankeshishian/whimsy/issues"
            target="_blank"
            rel="noopener"
            data-l10n-id="whimsy-home-link-feedback"
          ></a>
        </div>
      </section>

      <section
        id="whimsy-panel-changelog"
        class="whimsy-home-panel"
        tabindex="0" role="tabpanel"
        aria-labelledby="whimsy-tab-changelog"
        hidden="hidden"
      >
        <p class="whimsy-home-blurb" data-l10n-id="whimsy-changelog-blurb"></p>
        <div id="whimsy-changelog-list" class="whimsy-changelog-list"></div>
        <p id="whimsy-changelog-empty" class="whimsy-home-empty" data-l10n-id="whimsy-changelog-empty" hidden="hidden"></p>
      </section>
    </div>
    <script src="chrome://browser/content/whimsy/whimsy-home.js"></script>
  </body>
</html>
