<!-- home: about:whimsy, Whimsy's homepage (replaces Zen's about:home) with
     a Changelog tab (about:whimsy?tab=changelog, or #<build> for one build)
     and, legacy, a Privacy tab (about:whimsy?tab=privacy, the About
     dialog's Privacy Notice). Everything is local: no network fonts,
     images or scripts; the artwork is inline SVG. -->
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Security-Policy" content="default-src chrome:; object-src 'none'" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-l10n-id="whimsy-home-title"></title>
    <link rel="stylesheet" href="chrome://browser/content/whimsy/whimsy-home.css" />
    <link rel="localization" href="browser/whimsy.ftl" />
  </head>
  <body>
    <div class="whimsy-home" id="whimsy-home">
      <header class="wh-nav">
        <div class="wh-nav-inner">
          <div class="wh-brand">
            <svg class="wh-brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" aria-hidden="true">
              <defs>
                <radialGradient id="wh-mark-fill" cx="0.35" cy="0.3" r="0.8">
                  <stop offset="0" stop-color="#ff9ad6" />
                  <stop offset="0.5" stop-color="#f0479e" />
                  <stop offset="1" stop-color="#9a4dff" />
                </radialGradient>
              </defs>
              <path d="M16 30 C13 33 19 35 16 39" fill="none" stroke="#c06bd8" stroke-width="1.6" stroke-linecap="round" />
              <path d="M14 31 L16 28 L18 31 Z" fill="#b34fd6" />
              <ellipse cx="16" cy="14.5" rx="12.5" ry="14" fill="url(#wh-mark-fill)" />
              <ellipse cx="11.5" cy="9" rx="2.6" ry="4" fill="#fff" opacity="0.6" transform="rotate(-25 11.5 9)" />
            </svg>
            <h1 id="whimsy-home-heading" class="wh-brand-name" data-l10n-id="whimsy-home-brand"></h1>
          </div>
          <nav class="whimsy-home-tabs" role="tablist" aria-labelledby="whimsy-home-heading">
            <button
              type="button"
              id="whimsy-tab-home"
              aria-controls="whimsy-panel-home"
              class="whimsy-home-tab"
              role="tab"
              data-tab="home"
              data-l10n-id="whimsy-home-tab-home"
              aria-selected="true"
            ></button>
            <button
              type="button"
              id="whimsy-tab-changelog"
              aria-controls="whimsy-panel-changelog"
              tabindex="-1"
              class="whimsy-home-tab"
              role="tab"
              data-tab="changelog"
              data-l10n-id="whimsy-home-tab-changelog"
              aria-selected="false"
            ></button>
            <button
              type="button"
              id="whimsy-tab-privacy"
              aria-controls="whimsy-panel-privacy"
              tabindex="-1"
              class="whimsy-home-tab"
              role="tab"
              data-tab="privacy"
              data-l10n-id="whimsy-home-tab-privacy"
              aria-selected="false"
            ></button>
          </nav>
        </div>
      </header>

      <main>
        <section id="whimsy-panel-home" class="whimsy-home-panel" tabindex="-1" role="tabpanel" aria-labelledby="whimsy-tab-home">
          <div class="wh-hero">
            <div class="wh-hero-sky" aria-hidden="true"></div>
            <div class="wh-wrap wh-hero-inner">
              <div class="wh-hero-copy">
                <h2 class="wh-hero-title" data-l10n-id="whimsy-home-hero-title"></h2>
                <p class="wh-hero-lede whimsy-home-blurb" data-l10n-id="whimsy-home-blurb"></p>
                <p class="wh-hero-hint" data-l10n-id="whimsy-home-hero-hint"></p>
              </div>
              <div class="wh-hero-art">
                <span class="wh-sparkle wh-sparkle-1" aria-hidden="true"></span>
                <span class="wh-sparkle wh-sparkle-2" aria-hidden="true"></span>
                <span class="wh-sparkle wh-sparkle-3" aria-hidden="true"></span>
                <span class="wh-cloud wh-cloud-1" aria-hidden="true"></span>
                <span class="wh-cloud wh-cloud-2" aria-hidden="true"></span>
                <button type="button" id="whimsy-home-balloon" class="wh-balloon" data-l10n-id="whimsy-home-balloon">
                  <svg class="wh-balloon-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 310" aria-hidden="true">
                    <defs>
                      <radialGradient id="wh-balloon-fill" cx="0.34" cy="0.28" r="0.82">
                        <stop offset="0" stop-color="#ffa3da" />
                        <stop offset="0.42" stop-color="#f2479f" />
                        <stop offset="1" stop-color="#9447ff" />
                      </radialGradient>
                      <radialGradient id="wh-balloon-glow" cx="0.5" cy="0.5" r="0.5">
                        <stop offset="0" stop-color="#ff8fd0" stop-opacity="0.45" />
                        <stop offset="1" stop-color="#ff8fd0" stop-opacity="0" />
                      </radialGradient>
                      <linearGradient id="wh-leaf-fill" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#ffb347" />
                        <stop offset="1" stop-color="#d9542b" />
                      </linearGradient>
                      <radialGradient id="wh-pumpkin-fill" cx="0.38" cy="0.32" r="0.8">
                        <stop offset="0" stop-color="#ffc07a" />
                        <stop offset="0.55" stop-color="#f08a3c" />
                        <stop offset="1" stop-color="#c9661c" />
                      </radialGradient>
                      <g id="wh-flower">
                        <circle cx="0" cy="-5.5" r="4.4" /><circle cx="5.2" cy="-1.7" r="4.4" /><circle cx="3.2" cy="4.4" r="4.4" />
                        <circle cx="-3.2" cy="4.4" r="4.4" /><circle cx="-5.2" cy="-1.7" r="4.4" />
                      </g>
                    </defs>
                    <circle cx="100" cy="100" r="100" fill="url(#wh-balloon-glow)" />
                    <g class="wh-balloon-string">
                      <path d="M100 197 C 90 214, 111 230, 100 248 S 90 280, 102 306" fill="none" stroke="#c46fdc" stroke-width="2.5" stroke-linecap="round" />
                      <!-- Autumn: a little pumpkin rides on the string. -->
                      <g class="wh-costume" data-season="autumn">
                        <ellipse cx="102" cy="297" rx="14" ry="10.5" fill="url(#wh-pumpkin-fill)" />
                        <path d="M102 287 c-5 4 -5 16 0 20 M102 287 c5 4 5 16 0 20" fill="none" stroke="#b8541f" stroke-opacity="0.55" stroke-width="1.5" />
                        <path d="M101 288 c0 -4 1 -6 4 -8" fill="none" stroke="#5d9b4a" stroke-width="2.6" stroke-linecap="round" />
                      </g>
                    </g>
                    <path d="M92 199 L100 187 L108 199 Q100 203 92 199 Z" fill="#b14bd8" />
                    <path d="M100 6 C 152 6 184 46 184 96 C 184 146 146 186 100 190 C 54 186 16 146 16 96 C 16 46 48 6 100 6 Z" fill="url(#wh-balloon-fill)" />
                    <ellipse cx="66" cy="58" rx="15" ry="25" fill="#fff" opacity="0.55" transform="rotate(-28 66 58)" />
                    <circle cx="57" cy="98" r="5" fill="#fff" opacity="0.35" />
                    <!-- Seasonal costumes (whimsy-home.js sets whimsy-season on the
                         root from WhimsySeasons; none shows when it's off). -->
                    <g class="wh-costume" data-season="autumn">
                      <g transform="rotate(32 138 14)">
                        <path d="M138 -4 c14 7 15 24 0 36 c-15 -12 -14 -29 0 -36 Z" fill="url(#wh-leaf-fill)" />
                        <path d="M138 0 v37 M138 12 l7 -6 M138 22 l-7 -6" fill="none" stroke="#a8431f" stroke-opacity="0.7" stroke-width="1.8" stroke-linecap="round" />
                      </g>
                    </g>
                    <g class="wh-costume" data-season="winter">
                      <path d="M28 46 C 34 18 64 0 100 0 C 136 0 166 18 172 46 C 166 52 160 44 152 50 C 144 56 136 46 126 52 C 116 58 108 48 100 52 C 92 58 84 48 74 52 C 64 56 56 46 48 50 C 40 54 34 50 28 46 Z" fill="#fff" />
                      <path d="M40 48 C 52 52 60 46 70 49 M130 49 C 140 46 148 52 160 48" fill="none" stroke="#9fc4ea" stroke-opacity="0.6" stroke-width="2.4" stroke-linecap="round" />
                      <path d="M80 186 Q 100 196 120 186 L 122 197 Q 100 208 78 197 Z" fill="#2fa3b5" />
                      <path d="M110 198 L 118 232 L 108 234 L 102 200 Z" fill="#2fa3b5" />
                      <path d="M90 190 l-1 11 M100 193 v11 M110 190 l1 11 M113 214 l7 -1 M115 223 l7 -1" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="2.2" />
                    </g>
                    <g class="wh-costume" data-season="spring">
                      <path d="M30 56 C 52 26 76 18 100 18 C 124 18 148 26 170 56" fill="none" stroke="#5d9b4a" stroke-width="3" stroke-linecap="round" />
                      <path d="M56 32 c-5 -1 -8 2 -9 6 c5 1 8 -1 9 -6 Z M86 19 c1 -5 5 -7 9 -6 c-1 5 -5 7 -9 6 Z M146 32 c5 -1 8 2 9 6 c-5 1 -8 -1 -9 -6 Z" fill="#7cb85f" />
                      <use href="#wh-flower" x="36" y="49" fill="#fff" /><circle cx="36" cy="49" r="2.8" fill="#ffd86b" />
                      <use href="#wh-flower" x="66" y="27" fill="#ffe08a" /><circle cx="66" cy="27" r="2.8" fill="#ff8fbf" />
                      <use href="#wh-flower" x="100" y="18" fill="#fff" /><circle cx="100" cy="18" r="2.8" fill="#ffd86b" />
                      <use href="#wh-flower" x="134" y="27" fill="#ffe08a" /><circle cx="134" cy="27" r="2.8" fill="#ff8fbf" />
                      <use href="#wh-flower" x="164" y="49" fill="#fff" /><circle cx="164" cy="49" r="2.8" fill="#ffd86b" />
                    </g>
                    <g class="wh-costume" data-season="summer">
                      <path d="M52 84 h40 v8 c0 11 -8 17 -20 17 s-20 -6 -20 -17 Z M108 84 h40 v8 c0 11 -8 17 -20 17 s-20 -6 -20 -17 Z" fill="#2a1a3e" />
                      <path d="M92 87 c5 -4 11 -4 16 0" fill="none" stroke="#2a1a3e" stroke-width="4" stroke-linecap="round" />
                      <path d="M60 91 l9 -4 M116 91 l9 -4" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" />
                    </g>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div class="wh-wrap wh-section">
            <h2 class="wh-section-title" data-l10n-id="whimsy-home-features-title"></h2>
            <div class="wh-features">
              <article class="wh-feature">
                <span class="wh-icon wh-icon-pink" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="13" rx="3" /><path d="M8 4h9a4 4 0 0 1 4 4v9" /></svg>
                </span>
                <h3 data-l10n-id="whimsy-home-feature-spaces-title"></h3>
                <p data-l10n-id="whimsy-home-feature-spaces-text"></p>
              </article>
              <article class="wh-feature">
                <span class="wh-icon wh-icon-violet" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3" /></svg>
                </span>
                <h3 data-l10n-id="whimsy-home-feature-keys-title"></h3>
                <p data-l10n-id="whimsy-home-feature-keys-text"></p>
              </article>
              <article class="wh-feature">
                <span class="wh-icon wh-icon-blue" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" /><path d="M12 4v16" /></svg>
                </span>
                <h3 data-l10n-id="whimsy-home-feature-split-title"></h3>
                <p data-l10n-id="whimsy-home-feature-split-text"></p>
              </article>
              <article class="wh-feature">
                <span class="wh-icon wh-icon-peach" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
                </span>
                <h3 data-l10n-id="whimsy-home-feature-quiet-title"></h3>
                <p data-l10n-id="whimsy-home-feature-quiet-text"></p>
              </article>
            </div>
          </div>

          <div class="wh-wrap wh-section">
            <h2 class="wh-section-title" data-l10n-id="whimsy-home-links-title"></h2>
            <div class="whimsy-home-links" id="whimsy-home-links">
              <a id="whimsy-home-link-settings" class="whimsy-home-link" href="about:preferences">
                <span class="wh-icon wh-icon-violet" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" /><circle cx="16" cy="7" r="2.5" /><circle cx="8" cy="17" r="2.5" /></svg>
                </span>
                <span class="wh-link-text">
                  <span class="wh-link-title" data-l10n-id="whimsy-home-link-settings"></span>
                  <span class="wh-link-desc" data-l10n-id="whimsy-home-link-settings-text"></span>
                </span>
                <span class="wh-link-arrow" aria-hidden="true">→</span>
              </a>
              <a id="whimsy-home-link-shortcuts" class="whimsy-home-link" href="about:keyboard">
                <span class="wh-icon wh-icon-pink" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5" /><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M8 14h8" /></svg>
                </span>
                <span class="wh-link-text">
                  <span class="wh-link-title" data-l10n-id="whimsy-home-link-shortcuts"></span>
                  <span class="wh-link-desc" data-l10n-id="whimsy-home-link-shortcuts-text"></span>
                </span>
                <span class="wh-link-arrow" aria-hidden="true">→</span>
              </a>
              <button type="button" class="whimsy-home-link whimsy-home-link-button" id="whimsy-home-link-import">
                <span class="wh-icon wh-icon-blue" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14" /></svg>
                </span>
                <span class="wh-link-text">
                  <span class="wh-link-title" data-l10n-id="whimsy-home-link-import"></span>
                  <span class="wh-link-desc" data-l10n-id="whimsy-home-link-import-text"></span>
                </span>
                <span class="wh-link-arrow" aria-hidden="true">→</span>
              </button>
              <a
                id="whimsy-home-link-feedback"
                class="whimsy-home-link"
                href="https://github.com/ethankeshishian/whimsy/issues"
                target="_blank"
                rel="noopener"
              >
                <span class="wh-icon wh-icon-peach" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-4.5 3.5V17H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" /></svg>
                </span>
                <span class="wh-link-text">
                  <span class="wh-link-title" data-l10n-id="whimsy-home-link-feedback"></span>
                  <span class="wh-link-desc" data-l10n-id="whimsy-home-link-feedback-text"></span>
                </span>
                <span class="wh-link-arrow" aria-hidden="true">↗</span>
              </a>
            </div>
          </div>
        </section>

        <section
          id="whimsy-panel-changelog"
          class="whimsy-home-panel"
          tabindex="-1" role="tabpanel"
          aria-labelledby="whimsy-tab-changelog"
          hidden="hidden"
        >
          <div class="wh-wrap wh-page-head">
            <h2 class="wh-page-title" data-l10n-id="whimsy-home-tab-changelog"></h2>
            <p class="wh-page-lede" data-l10n-id="whimsy-changelog-blurb"></p>
          </div>
          <div class="wh-wrap">
            <div id="whimsy-changelog-list" class="whimsy-changelog-list"></div>
            <p id="whimsy-changelog-empty" class="whimsy-home-empty" data-l10n-id="whimsy-changelog-empty" hidden="hidden"></p>
          </div>
        </section>

        <!-- legacy: Whimsy's privacy note. Every service Whimsy talks to, and
             why; keep it in step with prefs/whimsy/whimsy.yaml's legacy block. -->
        <section
          id="whimsy-panel-privacy"
          class="whimsy-home-panel"
          tabindex="-1" role="tabpanel"
          aria-labelledby="whimsy-tab-privacy"
          hidden="hidden"
        >
          <div class="wh-wrap wh-page-head">
            <h2 class="wh-page-title" data-l10n-id="whimsy-home-tab-privacy"></h2>
            <p class="wh-page-lede" data-l10n-id="whimsy-privacy-blurb"></p>
          </div>
          <div class="wh-wrap">
            <ul class="whimsy-privacy-list">
              <li data-l10n-id="whimsy-privacy-mozilla"></li>
              <li data-l10n-id="whimsy-privacy-sync"></li>
              <li data-l10n-id="whimsy-privacy-dns"></li>
              <li data-l10n-id="whimsy-privacy-zen"></li>
              <li data-l10n-id="whimsy-privacy-apple"></li>
              <li data-l10n-id="whimsy-privacy-google"></li>
              <li data-l10n-id="whimsy-privacy-updates"></li>
              <li data-l10n-id="whimsy-privacy-search"></li>
            </ul>
          </div>
        </section>
      </main>

      <footer class="wh-footer">
        <div class="wh-wrap wh-footer-inner">
          <p data-l10n-id="whimsy-home-footer"></p>
        </div>
      </footer>
    </div>
    <script src="chrome://browser/content/whimsy/whimsy-home.js"></script>
  </body>
</html>
