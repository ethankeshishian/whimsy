<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src chrome:; img-src chrome: blob: data: page-icon: cached-favicon: moz-icon:; style-src chrome: 'unsafe-inline'; frame-src http: https:; object-src 'none'" />
    <meta name="color-scheme" content="light dark" />
    <title></title>
    <link rel="localization" href="browser/whimsy.ftl" />
    <link rel="icon" href="chrome://browser/skin/zen-icons/paintbrush.svg" />
    <link rel="stylesheet" href="chrome://browser/content/whimsy/whimsy-easel.css" />
    <script type="module" src="chrome://browser/content/whimsy/whimsy-easel.mjs"></script>
  </head>
  <body>
    <main id="easel" hidden>
      <h1 class="visually-hidden" data-l10n-id="whimsy-easel-heading"></h1>
      <div id="viewport" tabindex="0" role="application" aria-describedby="keyboard-help">
        <div id="world"></div>
        <div id="overlay" aria-hidden="true">
          <div id="guides"></div>
          <div id="marquee" hidden></div>
          <div id="selection" hidden>
            <span class="handle" data-handle="nw"></span>
            <span class="handle" data-handle="n"></span>
            <span class="handle" data-handle="ne"></span>
            <span class="handle" data-handle="e"></span>
            <span class="handle" data-handle="se"></span>
            <span class="handle" data-handle="s"></span>
            <span class="handle" data-handle="sw"></span>
            <span class="handle" data-handle="w"></span>
          </div>
        </div>
      </div>
      <p id="keyboard-help" class="visually-hidden" data-l10n-id="whimsy-easel-keyboard-help"></p>

      <div id="empty">
        <div class="empty-card">
          <h2 data-l10n-id="whimsy-easel-empty-title"></h2>
          <p data-l10n-id="whimsy-easel-empty-body"></p>
          <ul class="empty-hints">
            <li><kbd>T</kbd> <span data-l10n-id="whimsy-easel-empty-text"></span></li>
            <li><kbd>P</kbd> <span data-l10n-id="whimsy-easel-empty-draw"></span></li>
            <li><kbd>⌘</kbd><kbd>V</kbd> <span data-l10n-id="whimsy-easel-empty-paste"></span></li>
            <li><kbd>⌘</kbd><kbd>⇧</kbd><kbd>2</kbd> <span data-l10n-id="whimsy-easel-empty-capture"></span></li>
          </ul>
        </div>
      </div>

      <header id="topbar">
        <input id="easel-title" type="text" spellcheck="false" autocomplete="off" maxlength="200"
               data-l10n-id="whimsy-easel-title-input" />
        <div class="bar-group">
          <div class="segmented" role="group" data-l10n-id="whimsy-easel-history-group">
            <button id="undo" class="icon-button" data-l10n-id="whimsy-easel-undo">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5 3.5 9l4 4M4 9h8a4.5 4.5 0 0 1 0 9h-2"/></svg>
            </button>
            <button id="redo" class="icon-button" data-l10n-id="whimsy-easel-redo">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.5 5 4 4-4 4M16 9H8a4.5 4.5 0 0 0 0 9h2"/></svg>
            </button>
          </div>
          <div class="segmented" role="group" data-l10n-id="whimsy-easel-zoom-group">
            <button id="zoom-out" class="icon-button" data-l10n-id="whimsy-easel-zoom-out">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10"/></svg>
            </button>
            <button id="zoom-reset" class="text-button"></button>
            <button id="zoom-in" class="icon-button" data-l10n-id="whimsy-easel-zoom-in">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10h10M10 5v10"/></svg>
            </button>
          </div>
          <button id="share" class="pill-button" aria-haspopup="menu" aria-expanded="false" aria-controls="share-menu"
                  data-l10n-id="whimsy-easel-share"></button>
        </div>
      </header>

      <div id="share-menu" popover role="menu" data-l10n-id="whimsy-easel-share-menu">
        <button role="menuitem" data-export="copy" data-l10n-id="whimsy-easel-export-copy"></button>
        <button role="menuitem" data-export="png-light" data-l10n-id="whimsy-easel-export-png-light"></button>
        <button role="menuitem" data-export="png-dark" data-l10n-id="whimsy-easel-export-png-dark"></button>
        <button role="menuitem" data-export="pdf" data-l10n-id="whimsy-easel-export-pdf"></button>
        <p class="menu-note" data-l10n-id="whimsy-easel-export-note"></p>
      </div>

      <div id="contextbar" role="toolbar" hidden data-l10n-id="whimsy-easel-contextbar">
        <div class="ctx-group" data-for="text" role="radiogroup" data-l10n-id="whimsy-easel-font-group">
          <button role="radio" data-font="sans" class="font-button" data-l10n-id="whimsy-easel-font-sans"></button>
          <button role="radio" data-font="serif" class="font-button" data-l10n-id="whimsy-easel-font-serif"></button>
          <button role="radio" data-font="mono" class="font-button" data-l10n-id="whimsy-easel-font-mono"></button>
          <button role="radio" data-font="rounded" class="font-button" data-l10n-id="whimsy-easel-font-rounded"></button>
        </div>
        <div class="ctx-group" data-for="shape">
          <button data-action="fill" class="icon-button" data-l10n-id="whimsy-easel-fill">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="3"/><path class="fill-mark" d="M4.5 12.5 12.5 4.5M7.5 15.5l8-8"/></svg>
          </button>
        </div>
        <div class="ctx-group" data-for="capture">
          <button data-action="live" class="icon-button" data-l10n-id="whimsy-easel-live-play">
            <svg class="play" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5.5v9l7-4.5z"/></svg>
            <svg class="pause" viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5.5v9M12.5 5.5v9"/></svg>
          </button>
          <button data-action="open" class="icon-button" data-l10n-id="whimsy-easel-open-source">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11 4h5v5M16 4l-7 7M14 12v3.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5H8"/></svg>
          </button>
        </div>
        <div class="ctx-group">
          <button data-action="front" class="icon-button" data-l10n-id="whimsy-easel-bring-front">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="3.5" width="9.5" height="9.5" rx="2"/><path d="M4.5 7v8a1.5 1.5 0 0 0 1.5 1.5h7"/></svg>
          </button>
          <button data-action="back" class="icon-button" data-l10n-id="whimsy-easel-send-back">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="7" width="9.5" height="9.5" rx="2" stroke-dasharray="2 2"/><path d="M7 4.5h7a1.5 1.5 0 0 1 1.5 1.5v7"/></svg>
          </button>
          <button data-action="duplicate" class="icon-button" data-l10n-id="whimsy-easel-duplicate">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="7" width="9.5" height="9.5" rx="2"/><path d="M13 4.5V4a.5.5 0 0 0-.5-.5H4a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 .5.5h.5M11.75 9.5v5M9.25 12h5"/></svg>
          </button>
          <button data-action="delete" class="icon-button danger" data-l10n-id="whimsy-easel-delete">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M8 6V4.5h4V6M5.5 6l.7 9.6a1 1 0 0 0 1 .9h5.6a1 1 0 0 0 1-.9L14.5 6"/></svg>
          </button>
        </div>
      </div>

      <div id="toolbar" role="toolbar" data-l10n-id="whimsy-easel-toolbar">
        <div class="tool-group" role="group" data-l10n-id="whimsy-easel-tools-group">
          <button class="tool" data-tool="select" data-l10n-id="whimsy-easel-tool-select">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3.5 15 9.2l-4.6 1.2-2.1 4.6z"/></svg>
          </button>
          <button class="tool" data-tool="text" data-l10n-id="whimsy-easel-tool-text">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 5.5V4h11v1.5M10 4v12M7.5 16h5"/></svg>
          </button>
          <button class="tool" data-tool="pen" data-l10n-id="whimsy-easel-tool-pen">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 16.5s.5-2.6 1.4-3.5l8.4-8.4a1.6 1.6 0 0 1 2.2 2.2l-8.4 8.4c-.9.9-3.6 1.3-3.6 1.3zM11.8 6.1l2.1 2.1"/></svg>
          </button>
          <button class="tool" data-tool="highlighter" data-l10n-id="whimsy-easel-tool-highlighter">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6.5 13.5 7.8-7.8a1.5 1.5 0 0 0 0-2.1l-.4-.4a1.5 1.5 0 0 0-2.1 0L4 11l2.5 2.5zM4 11l-1 3.5L4.5 16l1.5-1M3 17h14"/></svg>
          </button>
          <button class="tool" data-tool="rect" data-l10n-id="whimsy-easel-tool-rect">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="4.5" width="13" height="11" rx="2.5"/></svg>
          </button>
          <button class="tool" data-tool="ellipse" data-l10n-id="whimsy-easel-tool-ellipse">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/></svg>
          </button>
          <button class="tool" data-tool="line" data-l10n-id="whimsy-easel-tool-line">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 15.5l11-11"/></svg>
          </button>
          <button class="tool" data-tool="arrow" data-l10n-id="whimsy-easel-tool-arrow">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 15.5l11-11M9 4.5h6.5V11"/></svg>
          </button>
          <button class="tool" data-tool="image" data-l10n-id="whimsy-easel-tool-image">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="4.5" width="13" height="11" rx="2"/><circle cx="7.5" cy="8.5" r="1.3"/><path d="m3.8 14 4-3.8 3 2.6 2-1.8 3.4 3"/></svg>
          </button>
        </div>
        <span class="divider" aria-hidden="true"></span>
        <div class="swatches" role="radiogroup" data-l10n-id="whimsy-easel-color-group"></div>
        <span class="divider" aria-hidden="true"></span>
        <div class="sizes" role="radiogroup" data-l10n-id="whimsy-easel-size-group">
          <button role="radio" class="size" data-size="0" data-l10n-id="whimsy-easel-size-small"><span class="dot"></span></button>
          <button role="radio" class="size" data-size="1" data-l10n-id="whimsy-easel-size-medium"><span class="dot"></span></button>
          <button role="radio" class="size" data-size="2" data-l10n-id="whimsy-easel-size-large"><span class="dot"></span></button>
        </div>
      </div>

      <div id="status" role="status" class="visually-hidden"></div>
      <input id="file-input" type="file" accept="image/*" multiple hidden />
    </main>

    <section id="off" hidden>
      <h1 data-l10n-id="whimsy-easel-off-title"></h1>
      <p data-l10n-id="whimsy-easel-off-body"></p>
    </section>

    <img id="print-image" alt="" />
  </body>
</html>
