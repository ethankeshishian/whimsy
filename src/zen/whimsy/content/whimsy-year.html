<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-l10n-id="whimsy-year-title"></title>
    <link rel="localization" href="browser/whimsy.ftl" />
    <link rel="stylesheet" href="chrome://browser/content/whimsy/whimsy-year.css" />
  </head>
  <body>
    <div id="whimsy-year-root">
      <div id="whimsy-year-empty" data-l10n-id="whimsy-year-empty" hidden></div>
      <div id="whimsy-year-deck">
        <div id="whimsy-year-cards"></div>
        <div id="whimsy-year-status" aria-live="polite" class="whimsy-visually-hidden"></div>
        <div id="whimsy-year-dots"></div>
        <div id="whimsy-year-nav">
          <button id="whimsy-year-prev" type="button" aria-label="Previous">‹</button>
          <button id="whimsy-year-copy" type="button" data-l10n-id="whimsy-year-copy-card"></button>
          <button id="whimsy-year-next" type="button" aria-label="Next">›</button>
          <button id="whimsy-year-done" type="button" data-l10n-id="whimsy-year-done"></button>
        </div>
      </div>
    </div>
    <script src="chrome://browser/content/whimsy/whimsy-year.js"></script>
  </body>
</html>
