<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-l10n-id="whimsy-game-title"></title>
    <link rel="localization" href="browser/whimsy.ftl" />
    <link rel="stylesheet" href="chrome://browser/content/whimsy/whimsy-game.css" />
  </head>
  <body>
    <div id="whimsy-game-root" data-style="gradient" data-state="ready">
      <header id="whimsy-game-hud">
        <h1 id="whimsy-game-name" data-l10n-id="whimsy-game-title"></h1>
        <div id="whimsy-game-scores">
          <span class="whimsy-game-stat">
            <span id="whimsy-game-best-label" data-l10n-id="whimsy-game-best"></span>
            <span id="whimsy-game-best">0</span>
          </span>
          <span class="whimsy-game-stat">
            <span id="whimsy-game-score-label" data-l10n-id="whimsy-game-score"></span>
            <span id="whimsy-game-score">0</span>
          </span>
        </div>
        <div id="whimsy-game-controls">
          <button id="whimsy-game-sound" type="button" aria-pressed="false" data-l10n-id="whimsy-game-sound"></button>
          <span id="whimsy-game-style-switch" role="group" data-l10n-id="whimsy-game-style-group">
            <button id="whimsy-game-style-gradient" type="button" data-l10n-id="whimsy-game-style-gradient"></button>
            <button id="whimsy-game-style-retro" type="button" data-l10n-id="whimsy-game-style-retro"></button>
          </span>
        </div>
      </header>
      <main id="whimsy-game-stage">
        <canvas id="whimsy-game-canvas"></canvas>
        <div id="whimsy-game-online-notice" class="whimsy-game-online-notice" hidden>
          <span class="whimsy-game-online-dot"></span>
          <span data-l10n-id="whimsy-game-back-online"></span>
          <button id="whimsy-game-reload-btn" type="button" data-l10n-id="whimsy-game-reload-page"></button>
        </div>
        <div id="whimsy-game-overlay" aria-live="polite">
          <div id="whimsy-game-overlay-ready" class="whimsy-game-card">
            <p class="whimsy-game-card-title" data-l10n-id="whimsy-game-start-title"></p>
            <p class="whimsy-game-card-body" data-l10n-id="whimsy-game-start-hint"></p>
          </div>
          <div id="whimsy-game-overlay-paused" class="whimsy-game-card" hidden>
            <p class="whimsy-game-card-title" data-l10n-id="whimsy-game-paused"></p>
          </div>
          <div id="whimsy-game-overlay-gameover" class="whimsy-game-card" hidden>
            <p class="whimsy-game-card-title" data-l10n-id="whimsy-game-over-title"></p>
            <p id="whimsy-game-death" class="whimsy-game-card-body"></p>
            <p id="whimsy-game-new-best" class="whimsy-game-badge" data-l10n-id="whimsy-game-new-best" hidden></p>
            <button id="whimsy-game-play-again" type="button" data-l10n-id="whimsy-game-play-again"></button>
          </div>
        </div>
      </main>
      <p id="whimsy-game-hint" data-l10n-id="whimsy-game-hint"></p>
    </div>
    <script src="chrome://browser/content/whimsy/whimsy-game.js"></script>
  </body>
</html>
