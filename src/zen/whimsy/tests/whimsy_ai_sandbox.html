<!doctype html><meta charset="utf-8"><title>Hidden reader capabilities</title>
<body><form action="?submitted"><input name="submitted" value="1"></form>
<a href="whimsy_video.mp4" download="hidden-preview.mp4">Download</a>
<script>
if (location.search.includes("submitted")) {
  document.body.textContent = "FORM_SUBMITTED";
} else {
  let popup = null;
  try { popup = window.open("about:blank", "_blank"); } catch (error) {
    if (error.name != "InvalidAccessError") { throw error; }
  }
  document.querySelector("a").click();
  document.querySelector("form").submit();
  document.body.textContent = "SCRIPT_RAN FORM_BLOCKED " + (popup ? "POPUP_OPENED" : "POPUP_BLOCKED");
}
</script>
