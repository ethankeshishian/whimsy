<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Your account has been locked</title>
<style>
  body { margin: 0; font: 15px/1.5 -apple-system, sans-serif; background: #fff; color: #1d1d1f; text-align: center; }
  main { max-width: 420px; margin: 0 auto; padding-top: 140px; }
  form { display: grid; gap: 12px; text-align: start; }
  input { height: 36px; padding: 0 10px; border: 1px solid #c9c9c9; border-radius: 6px; }
  button { height: 38px; border: 0; border-radius: 8px; background: #0071e3; color: white; }
</style>
</head>
<body>
<main>
<h1 style="font-size:24px">Your account has been locked</h1>
<p>We noticed unusual sign-in activity on your Fruitbank account. Verify within 24 hours or your account and data will be deleted.</p>
<form onsubmit="return false"><label>Account email<input type="email"></label><label>Password<input type="password"></label><button>Verify now</button></form>
</main>
</body>
</html>
