<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Lasso Reading List</title>
<style>body { margin: 0; font: 16px sans-serif; } ul { margin: 0; padding: 20px; list-style: none; } li { height: 30px; } #far { position: absolute; top: 600px; left: 20px; } #field { position: absolute; top: 400px; left: 20px; }</style>
</head>
<body>
<ul id="list">
<li><a id="a1" href="https://example.org/one">One</a></li>
<li><a id="a2" href="https://example.org/two">Two</a></li>
<li><a id="a3" href="https://example.org/three">Three</a></li>
<li><a id="dup" href="https://example.org/one">One again</a></li>
<li><a id="js" href="javascript:void(0)">Script link</a></li>
<li><span id="text">Plain text to select</span></li>
</ul>
<input id="field" value="Some text">
<a id="far" href="https://example.org/far">Far away</a>
</body>
</html>
