[DEFAULT]
head = "head.js"
support-files = ["whimsy_slow_load.sjs"]
# W11-14: the private lock's first-run question would pop up in every test
# that opens something private; browser_whimsy_private_lock.js tests it.
# W23 ai-core: AI is off until a provider connects; tests start with it on
# (browser_whimsy_ai_kill_switch.js and _plans.js check the default).
# W23 memory-fire: Memory and Related are on for people, but Memory asks
# the provider a second, background "memory" question after every answer
# and Related reads and indexes every public page a test loads; tests start
# with both off so other features' provider stubs and command-bar rows only
# see their own (browser_whimsy_ai_memory.js, _ai_index.js, and the
# memory-fire screens turn them on).
prefs = [
  "whimsy.ai.enabled=true",
  "whimsy.ai.memory=false",
  "whimsy.feature.ai-related=false",
  # Adaptive conversion is exercised explicitly by its own file; other
  # feature fixtures keep their authored colors and do not consume its toast.
  "whimsy.feature.dark-pages=false",
  "whimsy.privateLock.askDismissals.tabs=2",
  "whimsy.privateLock.askDismissals.space=2",
  "whimsy.privateLock.askDismissals.windows=2",
]

["browser_whimsy_ai_kill_switch.js"]

["browser_whimsy_allow_copy.js"]
support-files = ["whimsy_no_copy.html"]

