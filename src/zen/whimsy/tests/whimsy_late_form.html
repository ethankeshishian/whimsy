<!DOCTYPE html>
<meta charset="utf-8">
<title>Late sign up</title>
<div id="app">Loading…</div>
<script>
  // Like most sites today: the form is built after the page has loaded.
  addEventListener("load", () => setTimeout(() => {
    document.getElementById("app").innerHTML =
      '<form><input id="name" name="name" autocomplete="name"><input id="email" type="email" name="user_email"></form>';
  }, 600));
</script>
