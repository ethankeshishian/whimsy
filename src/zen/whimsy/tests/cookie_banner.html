<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cookie banner</title></head>
<body>
  <p>A page with a WordPress "Cookie Notice" banner.</p>
  <div id="cookie-notice" class="cookie-notice-visible" style="position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; background: #222; color: #fff;">
    We use cookies.
    <span id="cn-notice-buttons">
      <button id="cn-accept-cookie" onclick="choose('accept')">Accept</button>
      <button id="cn-refuse-cookie" onclick="choose('reject')">Reject</button>
    </span>
  </div>
  <script>
    function choose(choice) {
      document.body.dataset.choice = choice;
      document.getElementById("cookie-notice").remove();
    }
  </script>
</body>
</html>
