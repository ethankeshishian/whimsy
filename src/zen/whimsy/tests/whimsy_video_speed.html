<!DOCTYPE html>
<meta charset="utf-8">
<title>Whimsy video speed test</title>
<style>
  body { margin: 24px; font: 14px system-ui; }
  /* Like YouTube's player: a layer over the video takes every click. */
  #player { position: relative; width: 480px; height: 270px; background: #000; }
  #player video { width: 100%; height: 100%; display: block; }
  #shield { position: absolute; inset: 0; }
</style>
<div id="player">
  <video id="video" src="whimsy_video.mp4" loop muted preload="auto"></video>
  <div id="shield"></div>
</div>
<p id="outside">Outside the video.</p>
<video id="tiny" src="whimsy_video.mp4" muted preload="auto" width="64" height="36"></video>
<script>
  // What the page's own player would see.
  window.pageKeys = 0;
  window.pageClicks = 0;
  window.addEventListener("keydown", () => window.pageKeys++, true);
  window.addEventListener("click", () => window.pageClicks++, true);
</script>
