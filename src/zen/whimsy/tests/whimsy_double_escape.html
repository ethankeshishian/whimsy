<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Double Esc</title></head>
<body>
<div id="player" style="width: 320px; height: 180px; background: #234;"></div>
<script>
  window.escapeDowns = 0;
  window.fullscreenChanges = 0;
  document.addEventListener("keydown", e => {
    if (e.key == "Escape") {
      window.escapeDowns++;
    }
  }, true);
  document.addEventListener("fullscreenchange", () => window.fullscreenChanges++);
</script>
</body>
</html>
