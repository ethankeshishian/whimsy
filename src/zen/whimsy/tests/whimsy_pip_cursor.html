<!DOCTYPE html>
<meta charset="utf-8">
<title>Whimsy PiP cursor</title>
<style>
  body { margin: 0; }
  #native { display: block; width: 320px; height: 240px; }
  /* A custom player that hides the pointer while idle (YouTube-style). */
  #player { position: relative; width: 320px; height: 240px; margin-top: 20px; }
  #player.idle { cursor: none; }
  #custom { width: 100%; height: 100%; }
</style>
<video id="native" src="whimsy_video_sound.mp4" loop controls></video>
<div id="player"><video id="custom" src="whimsy_video_sound.mp4" loop></video></div>
<script>
  const player = document.getElementById("player");
  let timer = 0;
  const idleSoon = () => {
    player.classList.remove("idle");
    clearTimeout(timer);
    timer = setTimeout(() => player.classList.add("idle"), 300);
  };
  player.addEventListener("mousemove", idleSoon);
</script>
