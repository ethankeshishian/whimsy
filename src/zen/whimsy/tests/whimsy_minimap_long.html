<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Minimap long page</title>
<style>
  html, body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #222; background: #fff; }
  section { box-sizing: border-box; height: 100vh; padding: 48px 64px; }
  section:nth-child(odd) { background: #f3f5f8; }
  h1 { margin: 0 0 16px; font-size: 40px; }
  .bar { height: 14px; margin: 12px 0; border-radius: 4px; background: #c9d1dc; }
  .bar.short { width: 60%; }
  .card { height: 180px; margin: 24px 0; border-radius: 12px; background: #4a7bd0; }
  section:nth-child(3n) .card { background: #d0794a; }
</style>
</head>
<body>
  <section><h1>One</h1><div class="bar"></div><div class="bar"></div><div class="bar short"></div><div class="card"></div></section>
  <section><h1>Two</h1><div class="bar"></div><div class="bar short"></div><div class="card"></div><div class="bar"></div></section>
  <section><h1>Three</h1><div class="card"></div><div class="bar"></div><div class="bar"></div><div class="bar short"></div></section>
  <section><h1>Four</h1><div class="bar"></div><div class="bar"></div><div class="card"></div></section>
  <section><h1>Five</h1><div class="bar short"></div><div class="card"></div><div class="bar"></div></section>
</body>
</html>
