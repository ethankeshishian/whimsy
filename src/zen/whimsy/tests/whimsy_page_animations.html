<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Spinning</title>
<style>
  @keyframes whimsy-spin { to { transform: rotate(360deg); } }
  #spinner { width: 40px; height: 40px; background: teal; animation: whimsy-spin 1s linear infinite; transition: opacity 2s; }
  #spinner::after { content: ""; display: block; animation: whimsy-spin 1s linear infinite; }
</style>
</head>
<body>
<div id="spinner"></div>
</body>
</html>
