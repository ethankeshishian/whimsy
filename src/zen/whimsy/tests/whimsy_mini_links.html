<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mini links</title>
</head>
<body>
<!-- wave10/mini W10-13: a target=_blank link (a second page in Mini) and a
     plain link to Cmd-click (a background page in Mini). -->
<a id="blank" href="https://example.org/" target="_blank" style="display: block; width: 200px; height: 40px">New page</a>
<a id="plain" href="https://example.org/?plain" style="display: block; width: 200px; height: 40px">Plain link</a>
</body>
</html>
