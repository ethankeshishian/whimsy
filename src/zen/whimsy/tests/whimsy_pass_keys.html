<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pass Keys to Page</title>
<style>
  body { margin: 0; font: 14px ui-monospace, monospace; background: #111; color: #ddd; padding: 16px; height: 100vh; box-sizing: border-box; }
</style>
</head>
<body>
<p>dev@box:~$ vim notes.txt</p>
<script>
// Every keydown this page sees ("M-t" for ⌘T). It uses ⌘T and ⌘W itself (a
// web terminal would), so it cancels those two and nothing else.
window.keys = [];
addEventListener("keydown", event => {
  keys.push((event.metaKey ? "M-" : "") + (event.ctrlKey ? "C-" : "") + event.key);
  if (event.metaKey && (event.key == "t" || event.key == "w")) {
    event.preventDefault();
  }
});
</script>
</body>
</html>
