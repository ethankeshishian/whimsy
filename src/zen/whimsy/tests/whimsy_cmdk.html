<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weeknight miso salmon</title>
<style>
  body { margin: 0; font: 17px/1.6 Georgia, serif; color: #222; background: #fff; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 24px; }
  .kicker { font: 600 12px system-ui; letter-spacing: .06em; color: #c2410c; }
  h1 { font-size: 32px; margin: 6px 0 16px; }
  .row { display: flex; gap: 16px; margin: 18px 0; }
  .row img { flex: 1; min-width: 0; height: 220px; object-fit: cover; border-radius: 6px; }
  video { display: block; width: 100%; height: 380px; background: #111; border-radius: 8px; }
  textarea { width: 100%; height: 140px; font: 15px/1.6 system-ui; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; }
  .spacer { height: 1600px; }
  @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #eee; } textarea { background: #2c2c2e; color: #eee; border-color: #444; } }
</style>
</head>
<body>
<main id="main"></main>
<script>
  const kind = new URLSearchParams(location.search).get("kind") || "article";
  const main = document.getElementById("main");
  const para = n => Array.from({ length: n }, (_, i) => `<p>Miso, mirin, and a little brown sugar make a glaze that sets in the time the rice takes. Step ${i + 1}: keep the heat high and the pan dry so the skin crisps instead of steaming.</p>`).join("");
  const img = (w = "", id = "") => `<img ${id ? `id="${id}"` : ""} src="whimsy_test_image.png" alt="Tea house" ${w}>`;
  const pages = {
    article: `<div class="kicker">RECIPES</div><h1>Weeknight miso salmon</h1>${para(8)}<p id="sel">Apple’s M5 MacBook Air finally gets a 120Hz display and drops to 2.7 pounds.</p>${para(4)}`,
    video: `<h1>How M5 changes everything</h1><video id="video"></video><p>Short notes.</p>`,
    mixed: `<h1>Weeknight miso salmon</h1>${para(2)}<video style="height:200px"></video>${img('style="display:block;width:100%;height:200px"')}`,
    product: `<script type="application/ld+json">{"@context":"https://schema.org","@type":"Product","name":"MacBook Air","offers":{"price":"999.00","priceCurrency":"USD"}}<\/script><h1>Apple 2026 MacBook Air 13-inch</h1>${img('style="display:block;width:60%;height:260px"')}${para(2)}`,
    images: `<div class="kicker">KYOTO</div><h1>A morning in the old tea district</h1><p>Hoshino is the kind of tea house that never put up an English sign.</p><div class="row">${img("", "a")}${img("", "b")}${img("", "c")}</div>`,
    "one-image": `<h1>menu.jpg</h1><div class="row">${img('style="flex:3;height:420px"', "big")}${img('style="flex:1;height:120px"', "small")}</div>`,
    field: `<h1>Re: Offsite dates</h1><textarea id="field">i think the 14th works better for us becuase half the team is out the week before, can we lock it in by friday</textarea>`,
    otp: `<h1>Verify</h1><input id="otp" autocomplete="one-time-code" value="123456">`,
    foreign: `<h1 lang="ar" dir="rtl">أبل تكشف عن ماك بوك إير الجديد</h1><p id="sel" lang="ar" dir="rtl">أعلنت أبل عن جهاز ماك بوك إير الجديد بشاشة أسرع ووزن أخف</p>${para(3)}`,
    empty: `<div style="height:600px"></div>`,
  };
  main.innerHTML = (pages[kind] ?? pages.article) + (kind == "article" ? `<div class="spacer"></div>${img('id="late" style="display:block;width:100%;height:700px"')}` : "");
</script>
</body>
</html>
