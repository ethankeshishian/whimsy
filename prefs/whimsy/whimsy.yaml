# Whimsy's own prefs. Feature switches (whimsy.feature.*) are generated by
# whimsy/overlay.py into features.yaml, off when Zen ships the same feature.

# The browser interface's zoom, in percent. Web pages keep their own zoom.
- name: whimsy.ui-zoom
  value: 100

# The app icon (see WhimsyAppIcon.sys.mjs). "daydream" is the bundle icon.
- name: whimsy.app-icon
  value: "daydream"

# Update channel: "release" (standard: main, published nightly) or "dev"
# (every change, as soon as it's built). See WhimsyUpdates.initChannel.
- name: whimsy.update-channel
  value: "release"

# The install the post-update notice was last shown for.
- name: whimsy.updates.seen-install
  value: ""

# Reject cookie banners (Settings → Privacy & Security): runs Whimsy's
# built-in Autoconsent add-on (WhimsyCookieBanners.sys.mjs).
- name: whimsy.reject-cookie-banners
  value: true

# AI kill switch (Settings → Privacy & Security): turns off every AI feature,
# Firefox's and Whimsy's (WhimsyAI.sys.mjs). Off: AI features stay available.
- name: whimsy.ai.blocked
  value: false

# Dim sleeping (unloaded) tabs in the sidebar (Settings → Tab Management).
- name: whimsy.tabs.dim-sleeping
  value: false

# Lines a tab title may wrap onto in the sidebar: 1, 2 or 3
# (Settings → Tab Management).
- name: whimsy.tabs.title-lines
  value: 1

# Keep each space's new tab button fixed at the bottom of the sidebar
# (Settings → Tab Management). Off: Arc keeps "+ New Tab" at the top.
- name: whimsy.tabs.newtab-button-bottom
  value: false

# whimsy.folders.colors ({folderId: color}) has no default here: the pref
# generator writes "{}" unquoted, which breaks firefox.js. Code falls back to {}.

# Show page loading as a thin progress line across the top of the page
# instead of Zen's pill (Settings → Tab Management).
- name: whimsy.tabs.loading-line
  value: true

# Unread counts (from the page title) and update dots on pinned tabs and
# Essentials (Settings → Tab Management).
- name: whimsy.tabs.badges
  value: true

# Hide the space switcher at the bottom of the sidebar (Settings → Tab
# Management → Spaces). Off: the switcher shows, as in Zen and Arc.
- name: whimsy.spaces.hide-switcher
  value: false

# How see-through the sidebar and toolbars are, in percent (0–80; Settings →
# Look and Feel, macOS). 0 is Zen's opaque look.
- name: whimsy.look.transparency
  value: 0

# Icons beside context menu and tab menu items, like macOS 26's own menus
# (Settings → Look and Feel).
- name: whimsy.look.menu-icons
  value: true

# The browser interface's font family (Settings → Look and Feel). Empty is
# the system font. Web pages keep their own fonts.
- name: whimsy.look.ui-font
  value: ""

# Mute background tabs (Settings → Tab Management): "prioritize" mutes them
# only while the current tab plays sound, "background" lets only the current
# tab play, "off" lets every tab play.
- name: whimsy.media.background-mute
  value: prioritize

# Going back to a tab whose video is in picture-in-picture puts it back in
# the page (Arc; Settings → Tab Management).
- name: whimsy.media.pip-snap-back
  value: true

# A speed button in the picture-in-picture player (Firefox's, off there).
- name: media.videocontrols.picture-in-picture.playback-speed.enabled
  value: true

# Cmd+F with text selected opens Find with the selection, like Chrome and
# Safari (macOS Firefox leaves it off and uses Cmd+E for that).
- name: accessibility.typeaheadfind.prefillwithselection
  value: true

# Offer the Internet Archive's copy when a page is gone or its site can't be
# reached (Settings → Tab Management).
- name: whimsy.archive.prompt
  value: true

# The Wayback Machine availability API the bar asks (empty: archive.org's).
- name: whimsy.archive.api
  value: ""

# "View Image Info" on the image context menu: size, dimensions, type and
# alt text (Firefox hid it in Fx88).
- name: browser.menu.showViewImageInfo
  value: true

# "6 min" next to the Reader View button on articles (Settings → Look and
# Feel).
- name: whimsy.reader.reading-time
  value: true

# Dark pages in PDFs (Settings → Look and Feel): off by default.
- name: whimsy.pdf.dark
  value: false

# Where a link from another app opens (Settings → Tab Management):
# "glance" (a quick-look over the current tab), "tab" (Firefox's own
# behavior), or "quick-window" for Mini Whimsy, Arc's "Little Arc"
# (WhimsyQuickWindow.sys.mjs, batch12).
- name: whimsy.external-links.target
  value: tab

# batch8: tab lifecycle

# How long an unpinned, silent, unselected, non-split tab sits idle before
# whimsy.feature.auto-archive-tabs closes it into the Archive (Settings →
# Tab Management): "12h"/"24h"/"7d"/"30d"/"never".
- name: whimsy.tabs.archive.idle-after
  value: 12h

# Tree tabs' visual style when whimsy.feature.tree-tabs is on (Settings →
# Tab Management): "tree" (nested, collapsible branches, any depth) or
# "islands" (Opera Tab Islands-style, one level, colored pill per root).
- name: whimsy.tabs.tree-style
  value: tree
# batch6 #7: Shift+click a link opens it in a split instead of navigating
# it. Off by default: Shift+click is Firefox's own "open in new window".
# Settings -> Tab Management -> Tabs.
- name: whimsy.splitlink.shift-click
  value: false

# batch6 #16: what the command bar's "New Note" action opens. "none" hides
# it. Settings -> Tab Management -> Tabs.
- name: whimsy.new-note.target
  value: none
# batch9p: Scratch and private tabs open inside the window (Settings →
# Privacy & Security). Off: Cmd+Shift+N and Cmd+Option+T open a private
# window instead.
- name: whimsy.private.in-window
  value: true
# batch10: Library sidebar panels.

# Profile subdirectory a screenshot capture is saved into (Library → Files).
# Empty means the default, "whimsy-captures".
- name: whimsy.captures.folder
  value: ""
# batch13: page & reading
# Show Whimsy's menu bar icon (macOS, Settings → Look and Feel): a quick
# window and recent tabs, reachable without focusing a Whimsy window first.
- name: whimsy.menu-bar-extra.show
  value: true

# Bionic reading in Reader View (its own toolbar toggle button): bolds the
# leading letters of each word. Opt-in, off by default — some readers find
# it faster, others find it distracting.
- name: whimsy.reader.bionic
  value: false
# batch7: seasonal themes
# A dated accent tint and flourish for Halloween, winter holidays and
# spring (Settings → Look and Feel → Look); never changes a space's own
# colours, and respects reduced motion.
- name: whimsy.seasons.enabled
  value: true

# batch7: full URL on click
# Show the full, untrimmed address even without clicking the address bar
# (Settings → Look and Feel → Look → "Always show full address"). Off:
# Zen shows just the domain in the sidebar until you interact (Arc-style).
- name: whimsy.urlbar.always-full-url
  value: false

# batch7: Dock icon badge (download count), Settings → Tab Management.
- name: whimsy.downloads.dock-badge
  value: true

# Library page-attached notes use Firefox canonical URLs and TabNotes storage.
- name: browser.tabs.notes.enabled
  value: true
# batch7b: offline game (whimsy://game). Visual style: "gradient" (the app
# icon's colours) or "retro" (a pixel palette, chiptune off by default). Its
# own switch is on the game page itself, not in Settings.
- name: whimsy.game.style
  value: "gradient"

# batch7b: offline game chiptune (retro style only), off by default.
- name: whimsy.game.chiptune
  value: false

# batch7b: offline game high score.
- name: whimsy.game.high-score
  value: 0

# batch7b: Year in tabs (whimsy://year). A local-only JSON counter of tabs
# opened since this build first ran ({"total","bySpace","since"}); empty
# until the first tab opens. See WhimsyStats.sys.mjs.
- name: whimsy.stats.tabs-opened
  value: ""

# batch7b: the longest continuously open tab ever recorded, from a tab that
# has since closed (JSON {"title","url","ms"}); empty until one does.
- name: whimsy.stats.longest-tab
  value: ""

# batch7b: the last year Year in tabs' December 1st "ready" toast was
# shown, so it only shows once a year.
- name: whimsy.year.last-toast-year
  value: 0
# tierC-claude: the Claude space (Settings → Privacy & Security → Claude).
# Off until the user turns it on: then Whimsy runs a local MCP server on
# 127.0.0.1 for Claude Code, and Claude can use the tabs in the Claude space.
- name: whimsy.claude.enabled
  value: false

# Let Claude use every normal tab, not just the Claude space (private tabs
# and Scratch are never included).
- name: whimsy.claude.whole-browser
  value: false

# Ask before Claude clicks, types or fills forms on a site for the first
# time, and before it uses a tab outside the Claude space.
- name: whimsy.claude.ask-per-site
  value: true

# The server's port (picked at random the first time, then kept so the
# connect command keeps working), its bearer token, and the Claude space.
- name: whimsy.claude.port
  value: 0

- name: whimsy.claude.token
  value: ""

- name: whimsy.claude.space-id
  value: ""
# meeting: Next meeting in the sidebar (Library → Meetings).
# Read macOS Calendar (EventKit). Off until the person turns it on, which is
# when Whimsy asks macOS for calendar access.
- name: whimsy.next-meeting.apple-calendar
  value: false

# Google Calendar secret iCal addresses, a list kept by the Library's
# Meetings tab. Empty means none.
- name: whimsy.next-meeting.google-calendars
  value: ""

# The compact card near the top of the sidebar, from 15 minutes before a
# meeting until 10 minutes after it starts.
- name: whimsy.next-meeting.sidebar-card
  value: true
# ext: per-space extensions (WhimsySpaceExtensions.sys.mjs)
# whimsy.extensions.space-visibility ({extensionId: {spaces: [uuid, ...]}})
# and whimsy.extensions.space-isolation-managed ([extensionId, ...]) have no
# default here, same reason as whimsy.folders.colors above: the generator
# writes "{}"/"[]" unquoted, which breaks firefox.js. Code falls back to
# "{}" and "[]".
# home: Whimsy's homepage (about:whimsy, a Home tab + Changelog tab),
# replacing Zen's/Firefox's about:home. whimsy.feature.home turns it off
# (falls back to about:home; see WhimsyAboutPage.sys.mjs).
- name: browser.startup.homepage
  value: "about:whimsy"

# home: "What's new" (Help menu, About dialog's hidden release-notes link)
# opens Whimsy's own Changelog tab instead of Zen's or Firefox's release
# notes.
- name: app.releaseNotesURL
  value: "about:whimsy?tab=changelog"

- name: app.releaseNotesURL.aboutDialog
  value: "about:whimsy?tab=changelog"

- name: app.releaseNotesURL.prompt
  value: "about:whimsy?tab=changelog"
