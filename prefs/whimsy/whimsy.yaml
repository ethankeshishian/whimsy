# Whimsy's own prefs. Feature switches (whimsy.feature.*) are generated by
# whimsy/overlay.py into features.yaml, off when Zen ships the same feature.

# The browser interface's zoom, in percent. Web pages keep their own zoom.
- name: whimsy.ui-zoom
  value: 100

# The app icon (see WhimsyAppIcon.sys.mjs). "daydream" is the bundle icon.
- name: whimsy.app-icon
  value: "daydream"

# Update channel: "release" (standard: main, published nightly) or "dev"
# (every change, as soon as it's built). See WhimsyUpdates.initChannel.
- name: whimsy.update-channel
  value: "release"

# The install the post-update notice was last shown for.
- name: whimsy.updates.seen-install
  value: ""

# Reject cookie banners (Settings → Privacy & Security): runs Whimsy's
# built-in Autoconsent add-on (WhimsyCookieBanners.sys.mjs).
- name: whimsy.reject-cookie-banners
  value: true

# AI kill switch (Settings → Privacy & Security): turns off every AI feature,
# Firefox's and Whimsy's (WhimsyAI.sys.mjs). Off: AI features stay available.
- name: whimsy.ai.blocked
  value: false

# Dim sleeping (unloaded) tabs in the sidebar (Settings → Tab Management).
- name: whimsy.tabs.dim-sleeping
  value: false

# Lines a tab title may wrap onto in the sidebar: 1, 2 or 3
# (Settings → Tab Management).
- name: whimsy.tabs.title-lines
  value: 1

# Keep each space's new tab button fixed at the bottom of the sidebar
# (Settings → Tab Management). Off: Arc keeps "+ New Tab" at the top.
- name: whimsy.tabs.newtab-button-bottom
  value: false

# whimsy.folders.colors ({folderId: color}) has no default here: the pref
# generator writes "{}" unquoted, which breaks firefox.js. Code falls back to {}.

# Show page loading as a thin progress line across the top of the page
# instead of Zen's pill (Settings → Tab Management).
- name: whimsy.tabs.loading-line
  value: true

# Unread counts (from the page title) and update dots on pinned tabs and
# Essentials (Settings → Tab Management).
- name: whimsy.tabs.badges
  value: true

# Hide the space switcher at the bottom of the sidebar (Settings → Tab
# Management → Spaces). Off: the switcher shows, as in Zen and Arc.
- name: whimsy.spaces.hide-switcher
  value: false

# How see-through the sidebar and toolbars are, in percent (0–80; Settings →
# Look and Feel, macOS). 0 is Zen's opaque look.
- name: whimsy.look.transparency
  value: 0

# Icons beside context menu and tab menu items, like macOS 26's own menus
# (Settings → Look and Feel). Off by default, like Arc's text-only menus.
- name: whimsy.look.menu-icons
  value: false

# The browser interface's font family (Settings → Look and Feel). Empty is
# the system font. Web pages keep their own fonts.
- name: whimsy.look.ui-font
  value: ""

# Mute background tabs (Settings → Tab Management): "prioritize" mutes them
# only while the current tab plays sound, "background" lets only the current
# tab play, "off" lets every tab play.
- name: whimsy.media.background-mute
  value: prioritize

# Going back to a tab whose video is in picture-in-picture puts it back in
# the page (Arc; Settings → Tab Management).
- name: whimsy.media.pip-snap-back
  value: true

# A speed button in the picture-in-picture player (Firefox's, off there).
- name: media.videocontrols.picture-in-picture.playback-speed.enabled
  value: true

# Cmd+F with text selected opens Find with the selection, like Chrome and
# Safari (macOS Firefox leaves it off and uses Cmd+E for that).
- name: accessibility.typeaheadfind.prefillwithselection
  value: true

# Offer the Internet Archive's copy when a page is gone or its site can't be
# reached (Settings → Tab Management).
- name: whimsy.archive.prompt
  value: true

# The Wayback Machine availability API the bar asks (empty: archive.org's).
- name: whimsy.archive.api
  value: ""

# "View Image Info" on the image context menu: size, dimensions, type and
# alt text (Firefox hid it in Fx88).
- name: browser.menu.showViewImageInfo
  value: true

# "6 min" next to the Reader View button on articles (Settings → Look and
# Feel).
- name: whimsy.reader.reading-time
  value: true

# Dark pages in PDFs (Settings → Look and Feel): off by default.
- name: whimsy.pdf.dark
  value: false

# Where a link from another app opens (Settings → Tab Management):
# "glance" (a quick-look over the current tab), "tab" (Firefox's own
# behavior), or "quick-window" for Mini Whimsy, Arc's "Little Arc"
# (WhimsyQuickWindow.sys.mjs, batch12). Default Mini Whimsy, as in Arc
# (BUILD-PLAN §5; legacy audit B3).
- name: whimsy.external-links.target
  value: quick-window

# batch8: tab lifecycle

# How long an unpinned, silent, unselected, non-split tab sits idle before
# whimsy.feature.auto-archive-tabs closes it into the Archive (Settings →
# Tab Management): "12h"/"24h"/"7d"/"30d"/"never".
- name: whimsy.tabs.archive.idle-after
  value: 12h

# Tree tabs' visual style when whimsy.feature.tree-tabs is on (Settings →
# Tab Management): "tree" (nested, collapsible branches, any depth) or
# "islands" (Opera Tab Islands-style, one level, colored pill per root).
- name: whimsy.tabs.tree-style
  value: tree
# batch6 #7: Shift+click a link opens it in a split instead of navigating
# it. Off by default: Shift+click is Firefox's own "open in new window".
# (Not Arc's: Arc's Shift+click opens Peek; Whimsy keeps Zen's Option+click.)
# Settings -> Tab Management -> Tabs.
- name: whimsy.splitlink.shift-click
  value: false

# batch6 #16: what the command bar's "New Note" action opens. "none" hides
# it. Settings -> Tab Management -> Tabs.
- name: whimsy.new-note.target
  value: none
# batch9p: Scratch and private tabs open inside the window (Settings →
# Privacy & Security). Off: Cmd+Shift+N and Cmd+Option+T open a private
# window instead.
- name: whimsy.private.in-window
  value: true
# batch10: Library sidebar panels.

# Profile subdirectory a screenshot capture is saved into (Library → Files).
# Empty means the default, "whimsy-captures".
- name: whimsy.captures.folder
  value: ""
# batch13: page & reading
# Show Whimsy's menu bar icon (macOS, Settings → Look and Feel): a quick
# window and recent tabs, reachable without focusing a Whimsy window first.
- name: whimsy.menu-bar-extra.show
  value: true

# Bionic reading in Reader View (its own toolbar toggle button): bolds the
# leading letters of each word. Opt-in, off by default — some readers find
# it faster, others find it distracting.
- name: whimsy.reader.bionic
  value: false
# batch7: seasonal themes
# Seasonal touches (WhimsySeasons' calendar): loading colors, balloon costumes,
# command bar trim, Balloon Dash and changelog art (Settings → Look and Feel → Look);
# never changes a space's own colours, and respects reduced motion.
- name: whimsy.seasons.enabled
  value: true

# batch7: full URL on click
# Show the full, untrimmed address even without clicking the address bar
# (Settings → Look and Feel → Look → "Always show full address"). Off:
# Zen shows just the domain in the sidebar until you interact (Arc-style).
- name: whimsy.urlbar.always-full-url
  value: false

# batch7: Dock icon badge (download count), Settings → Tab Management.
- name: whimsy.downloads.dock-badge
  value: true

# Library page-attached notes use Firefox canonical URLs and TabNotes storage.
- name: browser.tabs.notes.enabled
  value: true
# batch7b: offline game (whimsy://game). Visual style: "gradient" (the app
# icon's colours) or "retro" (a pixel palette, chiptune off by default). Its
# own switch is on the game page itself, not in Settings.
- name: whimsy.game.style
  value: "gradient"

# batch7b: offline game sound (square-wave chiptune in retro, softer in smooth), off by default.
- name: whimsy.game.chiptune
  value: false

# batch7b: offline game high score.
- name: whimsy.game.high-score
  value: 0

# batch7b: Year in tabs (whimsy://year). A local-only JSON counter of tabs
# opened since this build first ran ({"total","bySpace","since"}); empty
# until the first tab opens. See WhimsyStats.sys.mjs.
- name: whimsy.stats.tabs-opened
  value: ""

# batch7b: the longest continuously open tab ever recorded, from a tab that
# has since closed (JSON {"title","url","ms"}); empty until one does.
- name: whimsy.stats.longest-tab
  value: ""

# batch7b: the last year Year in tabs' December 1st "ready" toast was
# shown, so it only shows once a year.
- name: whimsy.year.last-toast-year
  value: 0
# tierC-claude: the Claude space (Settings → Privacy & Security → Claude).
# Off until the user turns it on: then Whimsy runs a local MCP server on
# 127.0.0.1 for Claude Code, and Claude can use the tabs in the Claude space.
- name: whimsy.claude.enabled
  value: false

# Let Claude use every normal tab, not just the Claude space (private tabs
# and Scratch are never included).
- name: whimsy.claude.whole-browser
  value: false

# Ask before Claude clicks, types or fills forms on a site for the first
# time, and before it uses a tab outside the Claude space.
- name: whimsy.claude.ask-per-site
  value: true

# The server's port (picked at random the first time, then kept so the
# connect command keeps working), its bearer token, and the Claude space.
- name: whimsy.claude.port
  value: 0

- name: whimsy.claude.token
  value: ""

- name: whimsy.claude.space-id
  value: ""
# meeting: Next meeting in the sidebar (Library → Meetings).
# Read macOS Calendar (EventKit). Off until the person turns it on, which is
# when Whimsy asks macOS for calendar access.
- name: whimsy.next-meeting.apple-calendar
  value: false

# Google Calendar secret iCal addresses, a list kept by the Library's
# Meetings tab. Empty means none.
- name: whimsy.next-meeting.google-calendars
  value: ""

# The compact card near the top of the sidebar, from 15 minutes before a
# meeting until 10 minutes after it starts.
- name: whimsy.next-meeting.sidebar-card
  value: true
# ext: per-space extensions (WhimsySpaceExtensions.sys.mjs)
# whimsy.extensions.space-visibility ({extensionId: {spaces: [uuid, ...]}})
# and whimsy.extensions.space-isolation-managed ([extensionId, ...]) have no
# default here, same reason as whimsy.folders.colors above: the generator
# writes "{}"/"[]" unquoted, which breaks firefox.js. Code falls back to
# "{}" and "[]".
# home: Whimsy's homepage (about:whimsy, a Home tab + Changelog tab),
# replacing Zen's/Firefox's about:home. whimsy.feature.home turns it off
# (falls back to about:home; see WhimsyAboutPage.sys.mjs).
- name: browser.startup.homepage
  value: "about:whimsy"

# home: "What's new" (Help menu, About dialog's release-notes link) opens
# Whimsy's own Changelog tab. app.releaseNotesURL* and the other branding
# URLs are set in whimsy/engine_overrides.py (BRANDING_PREFS), not here:
# surfer's firefox-branding.js loads after this file and would win.

# legacy: Firefox/Mozilla leftovers (whimsy-handoff/legacy-audit.md).
# Each entry says what the pref is for and why Whimsy changes it. Kept on
# purpose, with reasons in the audit commit: Remote Settings, push, GMP,
# region lookup, system add-on updates, DoH rollout, MITM priming, Firefox
# Labs, Sync, Zen's share server and search partner codes.

- name: app.releaseNotesURL.prompt
  value: "about:whimsy?tab=changelog"
# tierC-vpn: VPN (Firefox's built-in IP Protection, engine/toolkit/components
# and engine/browser/components/ipprotection). Firefox ships this off; Whimsy
# turns on the master switch (Settings → Privacy & Security; also the real
# on/off for the toolbar button it auto-places) and the per-site "always use
# VPN" option on top of the existing per-site exclusions (already-built
# Firefox features, just gated off). Sign-in, proxying and quota stay
# Firefox's own; see WhimsyVPN.sys.mjs.
- name: browser.ipProtection.enabled
  value: true
- name: browser.ipProtection.features.siteInclusions
  value: true

# vpnspace: empty protects all containers; otherwise comma-separated context IDs.
- name: browser.ipProtection.whimsy.userContextIds
  value: ""
# Nimbus rollouts let Mozilla flip the defaults of any unlocked pref
# remotely, aimed at Firefox release users (Whimsy reports channel
# "release"). They can undo Zen's and Whimsy's own defaults, and Whimsy gets
# Gecko fixes with each Zen release instead. Firefox Labs (opt-in, Settings)
# still works. Not locked: about:config can turn rollouts back on.
- name: nimbus.rollouts.enabled
  value: false

# The daily "usage-reporting" ping counts Firefox's daily users for Mozilla
# and ignores the telemetry switch. Nothing in the browser reads it.
# Settings can still turn it on.
- name: datareporting.usage.uploadEnabled
  value: false

# Captive-portal ("log in to this network" bar) and connectivity checks stay
# on, but ask Apple's endpoint (the one macOS itself uses) instead of
# Mozilla's firefox-portal-detection.com. Apple answers with a 200 and this
# exact page, which CaptiveDetect compares byte for byte; the \n is part of
# the body. The connectivity check only needs the request to succeed, over
# IPv4 and IPv6 (captive.apple.com has A and AAAA records).
- name: captivedetect.canonicalURL
  value: "http://captive.apple.com/hotspot-detect.html"

- name: captivedetect.canonicalContent
  value: '<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>\n'

- name: network.connectivity-service.IPv4.url
  value: "http://captive.apple.com/hotspot-detect.html"

- name: network.connectivity-service.IPv6.url
  value: "http://captive.apple.com/hotspot-detect.html"

# ASRouter's remote providers bring Mozilla's Firefox promos and
# recommendations (spotlights, callouts, infobars): "cfr" from Remote
# Settings, "messaging-experiments" from Nimbus. Each value is Firefox's own
# (firefox.js) with only "enabled" changed. message-groups (frequency caps
# and the user-pref gates) and the local providers stay on.
- name: browser.newtabpage.activity-stream.asrouter.providers.cfr
  value: '{"id":"cfr","enabled":false,"type":"remote-settings","collection":"cfr","updateCycleInMs":3600000}'

- name: browser.newtabpage.activity-stream.asrouter.providers.messaging-experiments
  value: '{"id":"messaging-experiments","enabled":false,"type":"remote-experiments","updateCycleInMs":3600000}'

# Help → Share Ideas and Feedback opens Whimsy's GitHub issues instead of
# Mozilla Connect (same place as the Library footer and about:whimsy).
- name: app.feedback.baseURL
  value: "https://github.com/ethankeshishian/whimsy/issues"

# batch3glance: Glance size: compact (60%), standard (Zen's 80%) or wide (90%).
- name: whimsy.glance.size
  value: "standard"

# wave3/cmdbar: offline bangs. whimsy.bangs.custom (the edited catalog) has
# no default on purpose: no user value means the bundled list
# (WhimsyBangsData.sys.mjs), and a default of "" would make a saved empty
# list ("no bangs") equal the default, which libpref stores as no value.

# wave3/icons: the emoji skin tone in the icon picker (0 = default yellow,
# 1-5 = light to dark), chosen from the hand beside the emoji search.
- name: whimsy.spaces.emoji-skin-tone
  value: 0


# wave3/glass: Liquid Glass (Settings → Look and Feel, macOS 26 and later).
# The window's backdrop becomes the system glass material (NSGlassEffectView,
# whimsy-nsCocoaWindow-mm.patch) and the sidebar and toolbars go see-through
# over it. Off: Zen's blurred material.
- name: whimsy.look.liquid-glass
  value: false

# wave3: email-aliases. Show the alias button in email fields.
- name: whimsy.email-aliases.button
  value: true


# wave3: handoff. Offer the current page to your other Apple devices
# (Firefox's Handoff; private tabs and Scratch are never offered).
- name: whimsy.handoff.send
  value: true


# wave3: playlist. Download saved media into the profile for offline play.
- name: whimsy.playlist.offline-download
  value: true

# wave3/ai: AI provider (Settings → Privacy & Security → AI provider):
# "apple" (on-device), "claude" (API key, kept in the Keychain-encrypted
# whimsy-ai-keys.json, never in prefs) or "ollama". Only this one is used.
- name: whimsy.ai.provider
  value: "apple"

# Empty means Whimsy's default (the latest Claude model).
- name: whimsy.ai.claude.model
  value: ""

- name: whimsy.ai.ollama.endpoint
  value: "http://127.0.0.1:11434"

# Picked in Settings from the models the Ollama server has.
- name: whimsy.ai.ollama.model
  value: ""

# wave5/lan: Local servers live folder. Ports probed on localhost (comma
# separated; empty means the built-in list of common dev-server ports) and
# how often to probe while the folder is visible.
- name: whimsy.live-folders.local-servers.ports
  value: ""

- name: whimsy.live-folders.local-servers.poll-ms
  value: 5000

# wave5/safety: agent replay. Keep a timeline of each Claude run (steps and
# small page snapshots) in the profile, shown at whimsy://replay.
- name: whimsy.claude.replay
  value: true

# wave5/quick: new season toast. The season that already had its toast
# ("2026-autumn"); empty until the first one.
- name: whimsy.seasons.last-toast
  value: ""

# wave5/verbs: your own selection verbs (skills), one per line:
# "Label | https://example.com/?q=%s" (%s the selection, or the page address
# when nothing is selected; %t the page title; %u its address).
- name: whimsy.verbs.skills
  value: ""

# system: which of History's Show filters the Library opens on: "all",
# "closed" (archived tabs) or "snoozed". "View Archive…" and "View Snoozed
# Tabs…" set it; the old Archive section's saved state migrates here.
- name: whimsy.library.history.view
  value: all

# wave5/profiles: per-profile search engine and download folder (synced maps,
# WhimsyProfileSync: {profile key: [value, time]}; empty means none).
# wave7/security L6: the download folder stays on this Mac (like Firefox's
# own, it never syncs: another device could point downloads anywhere).
- name: whimsy.profiles.search-engines
  value: ""

- name: services.sync.prefs.sync.whimsy.profiles.search-engines
  value: true

- name: whimsy.profiles.download-dirs
  value: ""

- name: services.sync.prefs.sync.whimsy.profiles.download-dirs
  value: true

# Login guid → profile key, and history page guid → profile keys (synced
# maps, WhimsyProfileSync), so other devices scope passwords and history
# the same way.
- name: whimsy.profiles.login-tags
  value: ""

- name: services.sync.prefs.sync.whimsy.profiles.login-tags
  value: true

- name: whimsy.profiles.history-places
  value: ""

- name: services.sync.prefs.sync.whimsy.profiles.history-places
  value: true

# The person's own engine/folder, kept while a profile's is applied.
- name: whimsy.profiles.saved-search-engine
  value: ""

- name: whimsy.profiles.saved-download
  value: ""

# wave5/profiles: honour extensions.userContextIsolation.<id>.restricted
# (set only for extensions limited to some profiles). Firefox reads this when
# an extension starts, so it has to be on from startup.
- name: extensions.userContextIsolation.enabled
  value: true

# Extensions per profile: extension id → profile keys (JSON; empty = none
# limited). Synced, keyed by profile key like the profiles themselves.
- name: whimsy.profiles.extensions
  value: ""

- name: services.sync.prefs.sync.whimsy.profiles.extensions
  value: true

# wave6/zap: things zapped off pages (WhimsyZap), counted for Year in tabs.
- name: whimsy.stats.zapped
  value: 0

# Find (Cmd+F): highlight every match like Chrome, lighter for the others
# and stronger for the current one. Firefox's own "Highlight All", on by
# default; the find bar's checkbox still turns it off.
- name: findbar.highlightAll
  value: true

- name: ui.textHighlightBackground
  value: "#fff1a8"

- name: ui.textHighlightForeground
  value: "#1d1a26"

- name: ui.textSelectAttentionBackground
  value: "#ff9632"

- name: ui.textSelectAttentionForeground
  value: "#1d1a26"
# wave7/focus: paste guard. The person's own on/off ("Turn Paste Guard On/Off"
# in the command bar); whimsy.feature.paste-guard is the master switch.
- name: whimsy.paste-guard.enabled
# wave7/teach: Teach once (WhimsyTeach.sys.mjs). "Show tips" in Settings →
