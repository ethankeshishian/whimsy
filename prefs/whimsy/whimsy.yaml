- name: whimsy.menus.hidden.link
  value: ""

- name: whimsy.menus.hidden.page
  value: ""

- name: whimsy.menus.hidden.selection
  value: ""

- name: whimsy.menus.hidden.image
  value: ""

- name: whimsy.menus.hidden.space
  value: ""

- name: whimsy.menus.hidden.sidebar
  value: ""

- name: whimsy.menus.hidden.folder
  value: ""

- name: whimsy.menus.hidden.split-row
  value: ""

- name: whimsy.menus.hidden.split-pane
  value: ""

# w7native/lan: the Local servers folder also lists HTTP services advertised
# over Bonjour on the local network (native nsIWhimsyBonjour), browsed only
# while the folder is visible.
- name: whimsy.live-folders.local-servers.bonjour

# wave7/small: the Linear workspace Search Linear last saw in a tab
# (linear.app/<workspace>/...), for its search page. Set by Whimsy.
- name: whimsy.verbs.linear-workspace
  value: ""

# wave7/small: start command-bar-only parts of each window (and network
# refreshers, seasonal toasts) once the window is idle instead of at once.
- name: whimsy.startup.lazy-init
  value: true
